name: Feijuca.Auth.Build

on:
  push:
    branches:
      - main
    paths:
      - 'src/NuGet/Feijuca.Auth/**'

  pull_request:
    branches:
      - main
    paths:
      - 'src/NuGet/Feijuca.Auth/**'

permissions:
  contents: write
  id-token: write

jobs:
  build-project:
    runs-on: ubuntu-latest
    name: Build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/NuGet/Feijuca.Auth/Feijuca.Auth.csproj

      - name: Build
        run: dotnet build --configuration Release src/NuGet/Feijuca.Auth/Feijuca.Auth.csproj

  bump:
    name: Update project version
    runs-on: ubuntu-latest
    needs: build-project

    if: github.ref == 'refs/heads/main'

    outputs:
      version: ${{ steps.set-version.outputs.VERSION }}
      version_update_type: ${{ steps.determine_update_type.outputs.VERSION_UPDATE_TYPE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine update type
        id: determine_update_type
        run: |
          LAST_COMMIT_MESSAGE=$(git log -1 --pretty=%B)

          if echo "$LAST_COMMIT_MESSAGE" | grep -qiE "^feat"; then
            echo "VERSION_UPDATE_TYPE=MINOR" >> $GITHUB_OUTPUT
            echo "VERSION_UPDATE_TYPE=MINOR" >> $GITHUB_ENV

          elif echo "$LAST_COMMIT_MESSAGE" | grep -qiE "^fix"; then
            echo "VERSION_UPDATE_TYPE=REVISION" >> $GITHUB_OUTPUT
            echo "VERSION_UPDATE_TYPE=REVISION" >> $GITHUB_ENV

          else
            echo "VERSION_UPDATE_TYPE=NONE" >> $GITHUB_OUTPUT
            echo "VERSION_UPDATE_TYPE=NONE" >> $GITHUB_ENV
          fi

      - name: Bump version - Minor
        if: env.VERSION_UPDATE_TYPE == 'MINOR'
        id: bump-minor
        uses: vers-one/dotnet-project-version-updater@v1.5
        with:
          file: src/NuGet/Feijuca.Auth/Feijuca.Auth.csproj
          version: "*.^.0"

      - name: Bump version - Revision
        if: env.VERSION_UPDATE_TYPE == 'REVISION'
        id: bump-revision
        uses: vers-one/dotnet-project-version-updater@v1.5
        with:
          file: src/NuGet/Feijuca.Auth/Feijuca.Auth.csproj
          version: "*.*.^"

      - name: Commit and push version update
        if: env.VERSION_UPDATE_TYPE == 'MINOR' || env.VERSION_UPDATE_TYPE == 'REVISION'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "CI: Updating application version [skip ci]"
          git push

      - name: Set version output
        id: set-version
        if: env.VERSION_UPDATE_TYPE == 'MINOR' || env.VERSION_UPDATE_TYPE == 'REVISION'
        run: |
          if [[ "${{ env.VERSION_UPDATE_TYPE }}" == "REVISION" ]]; then
            echo "VERSION=${{ steps.bump-revision.outputs.newVersion }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ steps.bump-minor.outputs.newVersion }}" >> $GITHUB_OUTPUT
          fi

  publish-nuget-package:
    name: Publish NuGet Package

    runs-on: ubuntu-latest

    needs:
      - bump

    environment: production

    permissions:
      id-token: write
      contents: read

    if: >
      github.ref == 'refs/heads/main' &&
      (needs.bump.outputs.version_update_type == 'MINOR' ||
       needs.bump.outputs.version_update_type == 'REVISION')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/NuGet/Feijuca.Auth/Feijuca.Auth.csproj

      - name: Build
        run: |
          dotnet build \
            src/NuGet/Feijuca.Auth/Feijuca.Auth.csproj \
            --configuration Release \
            --no-restore

      - name: Pack
        run: |
          dotnet pack \
            src/NuGet/Feijuca.Auth/Feijuca.Auth.csproj \
            --configuration Release \
            --no-build \
            --output ./nupkgs

      - name: Publish package to NuGet
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json"
